<!-- Lightweight abstract AI illustration -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="AI illustration">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#lg)" opacity="0.08"/>
  <g transform="translate(60,60)" fill="none" stroke="#0f172a" stroke-opacity="0.06" stroke-width="10">
    <rect x="0" y="0" width="420" height="220" rx="18" />
  </g>
  <g transform="translate(480,120)" fill="#fff" opacity="0.95">
    <circle cx="40" cy="40" r="34" fill="#fff" opacity="0.06"/>
    <rect x="90" y="10" width="220" height="120" rx="14" fill="#fff" opacity="0.06"/>
  </g>
  <g transform="translate(220,220)" fill="url(#lg)" opacity="0.9">
    <rect x="0" y="0" width="360" height="200" rx="16" />
  </g>
  <g transform="translate(260,260)" fill="#fff">
    <circle cx="40" cy="40" r="8"/>
    <circle cx="90" cy="72" r="8"/>
    <circle cx="140" cy="32" r="8"/>
  </g>
</svg>