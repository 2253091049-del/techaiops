<svg xmlns="http://www.w3.org/2000/svg" width="240" height="72" viewBox="0 0 240 72" fill="none" role="img" aria-label="Tech AI Ops logo">
  <defs>
    <linearGradient id="brandGrad" x1="8" y1="8" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.35" stop-color="#3B82F6"/>
      <stop offset="0.68" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="8" width="56" height="56" rx="16" fill="url(#brandGrad)" filter="url(#glow)"/>
  <path d="M19 30H45M19 40H37" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <circle cx="44" cy="46" r="8" fill="url(#pulseGrad)"/>

  <g transform="translate(74 14)">
    <text x="0" y="22" fill="#EAF2FF" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="0.2">Tech AI Ops</text>
    <text x="0" y="41" fill="#BFD5FF" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">AUTOMATE • OPTIMIZE • OUTPERFORM</text>
  </g>
</svg>
